server {
    listen 80;

    location /api/auth/   { proxy_pass http://auth-service:8000/; }
    location /api/domain/ { proxy_pass http://domain-service:8000/; }
    location /api/agent/  {
        proxy_pass http://agent-service:8000/;
        proxy_read_timeout 300s;
    }

    location /health { return 200 'gateway ok'; add_header Content-Type text/plain; }
}
