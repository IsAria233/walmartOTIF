const $=s=>document.querySelector(s);const money=v=>v===null||v===undefined?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v);const pretty=s=>s.replaceAll('_',' ').replace(/\b\w/g,x=>x.toUpperCase());const statusType=s=>({awaiting_approval:'amber',investigating:'blue',handed_off:'red',closed:'green',pending:'gray',revision_required:'amber'}[s]||'gray');const badge=s=>`<span class="badge ${statusType(s)}">● ${pretty(s)}</span>`;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function shell(inner,label){const b=state.page;return `<div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">O</div><div><strong>OTIF Control Center</strong><small>Operations Intelligence</small></div></div><div class="side-section">WORKSPACE</div><button class="navbtn ${['cases','case'].includes(b)?'active':''}" onclick="nav('cases')"><span class="glyph">▤</span> Investigations</button><button class="navbtn ${['fines','fine'].includes(b)?'active':''}" onclick="nav('fines')"><span class="glyph">▦</span> Fine Records</button><div class="side-section">DEMO SHORTCUTS</div><button class="navbtn" onclick="viewCase('CASE-2026-0142')"><span class="glyph">◈</span> Review sample case</button><button class="navbtn" onclick="state.caseId='CASE-2026-0139';state.tab='finding';nav('case')"><span class="glyph">⚑</span> Handoff example</button><div class="sidefoot"><span class="dot"></span> Prototype environment<br><span style="font-size:10px;opacity:.8">No API connection · mock data</span></div></aside><section class="main"><div class="demo-banner"><span><b>INTERACTIVE UI CONCEPT</b> — Example records only. No backend calls, real approvals, or persistent changes.</span><span>v0.1 · Team review</span></div><header class="topbar"><div class="breadcrumbs">Walmart OTIF &nbsp;/&nbsp; <b>${esc(label)}</b></div><div class="righttop"><label class="role" for="demo-role" style="white-space:nowrap">Demo role</label><select id="demo-role" class="select" style="min-width:155px" onchange="state.role=this.value;render()"><option value="dispute_associate" ${state.role==='dispute_associate'?'selected':''}>Associate</option><option value="compliance_manager" ${state.role==='compliance_manager'?'selected':''}>Manager</option><option value="admin" ${state.role==='admin'?'selected':''}>Admin</option></select><div class="avatar">${state.role==='compliance_manager'?'M':state.role==='admin'?'A':'S'}</div><button class="btn small" onclick="nav('cases')">Case Queue</button></div></header><div class="content">${inner}</div></section></div><div class="mobile-nav"><button class="${['cases','case'].includes(b)?'active':''}" onclick="nav('cases')">▤ Cases</button><button class="${['fines','fine'].includes(b)?'active':''}" onclick="nav('fines')">▦ Fines</button><button onclick="viewCase('CASE-2026-0142')">◈ Sample case</button></div>`}
function login(){return `<div class="login-page"><section class="login-left"><div><div style="font-size:17px;font-weight:800">◈ &nbsp; OTIF Control Center</div><div style="font-size:12px;letter-spacing:1.8px;color:#91add1;margin-top:5px">OPERATIONS INTELLIGENCE</div></div><div><h1>Better decisions.<br>Clearer evidence.</h1><p>Investigate OTIF fines, trace supporting records, review Agent findings, and make auditable human decisions.</p></div><div style="font-size:11px;color:#7897bf">UI CONCEPT · INTERNAL TEAM DEMONSTRATION</div></section><section class="login-right"><div class="login-card"><div class="login-logo">◈</div><span class="mock-label">DEMO MODE · NOT A REAL LOGIN</span><h2 style="margin-top:20px">Welcome back</h2><p class="subtitle" style="margin:7px 0 29px">Choose a demo role to explore the interface.</p><div class="formline"><label>Demo user role</label><select id="rolepick"><option value="dispute_associate">Dispute Associate</option><option value="compliance_manager">Compliance Manager</option><option value="admin">Admin</option></select></div><div class="formline"><label>Email / Username</label><input value="demo_associate" disabled></div><div class="formline"><label>Password</label><input type="password" value="mock-password" disabled></div><button class="btn primary" onclick="state.role=$('#rolepick').value;nav('cases')">Enter demo workspace →</button><p class="annotation">This is a presentation prototype. Authentication is simulated; the real backend provides JWT login and /me.</p></div></section></div>`}
function casesPage(){let f=cases.filter(c=>(state.filter==='all'||c.status===state.filter)&&[c.id,c.fine,c.po,c.supplier].join(' ').toLowerCase().includes(state.query.toLowerCase()));let stats=[['Total Cases',cases.length,'Sample cases in this demo'],['Awaiting Review',cases.filter(c=>c.status==='awaiting_approval').length,'Human decision pending'],['In Investigation',cases.filter(c=>c.status==='investigating').length,'Agent workflow'],['Closed',cases.filter(c=>c.status==='closed').length,'Historical results']];return shell(`<div class="page-head"><div><div class="eyebrow">Operations / Investigations</div><h1 class="page-title">Investigation Queue</h1><p class="subtitle">Track exceptions, review findings, and resolve OTIF disputes.</p></div><div class="action-row"><button class="btn primary" onclick="viewCase('CASE-2026-0142')">Explore approval case →</button><button class="btn" onclick="toast('Demo only: data refresh simulated')">↻ &nbsp; Refresh</button></div></div><div class="stats">${stats.map((s,i)=>`<div class="stat"><div class="statname">${s[0]}</div><div class="statnum ${i===1?'stataccent':''}">${s[1]}</div><div class="stattip">${s[2]}</div></div>`).join('')}</div><div class="card"><div class="cardhead"><div><div class="cardtitle">All investigations</div><div class="cardsub">Use the filters to narrow down the work queue</div></div><span class="badge blue">${f.length} results</span></div><div class="toolbar"><div class="searchbox"><span>⌕</span><input aria-label="Search cases" placeholder="Search case, fine, PO, supplier…" value="${esc(state.query)}" oninput="state.query=this.value;renderKeepFocus()"></div><select class="select" aria-label="Filter by status" onchange="state.filter=this.value;render()">${['all','pending','investigating','awaiting_approval','handed_off','revision_required','closed'].map(x=>`<option value="${x}" ${state.filter===x?'selected':''}>${x==='all'?'All statuses':pretty(x)}</option>`).join('')}</select><button class="btn small" onclick="state.query='';state.filter='all';render()">Clear filters</button></div><div class="tablewrap"><table><thead><tr><th>Case / Fine</th><th>Supplier & PO</th><th>Origin</th><th>Created</th><th>Status</th><th>Action</th></tr></thead><tbody>${f.map(c=>`<tr class="data-row" onclick="viewCase('${c.id}')"><td><span class="link">${c.id}</span><span class="subid">${c.fine}</span></td><td><b style="color:#33445f">${c.supplier}</b><span class="subid">${c.po}</span></td><td>${pretty(c.origin)}</td><td>${c.created}</td><td>${badge(c.status)}</td><td><span class="link">View case →</span></td></tr>`).join('')||`<tr><td colspan="6"><div class="empty"><strong>No matching cases</strong>Try clearing your filters.</div></td></tr>`}</tbody></table></div><div class="tablefoot"><span>Showing ${f.length} of ${cases.length} sample investigations</span><span>Demo pagination · 1 page</span></div></div>`, 'Investigations')}
function finePage(){const f=cases.filter(c=>[c.fine,c.po,c.supplier].join(' ').toLowerCase().includes(state.fineQuery.toLowerCase()));return shell(`<div class="page-head"><div><div class="eyebrow">Operations / Fine Records</div><h1 class="page-title">Fine Records</h1><p class="subtitle">Browse disputed and pre-invoice OTIF penalties.</p></div></div><div class="card"><div class="cardhead"><div><div class="cardtitle">Recorded fines</div><div class="cardsub">Sample records for interface evaluation</div></div><span class="badge gray">${f.length} fines</span></div><div class="toolbar"><div class="searchbox"><span>⌕</span><input placeholder="Search fine, PO or supplier…" value="${esc(state.fineQuery)}" oninput="state.fineQuery=this.value;renderKeepFocus()"></div></div><div class="tablewrap"><table><thead><tr><th>Fine record</th><th>Purchase order</th><th>Supplier</th><th>Metric</th><th>Original fine</th><th>Linked case</th></tr></thead><tbody>${f.map(c=>`<tr class="data-row" onclick="state.caseId='${c.id}';nav('fine')"><td class="link">${c.fine}</td><td>${c.po}</td><td>${c.supplier}</td><td>${c.metric}</td><td><b>${money(c.amount)}</b></td><td><span class="link">${c.id} →</span></td></tr>`).join('')}</tbody></table></div><div class="tablefoot">Showing ${f.length} sample fine records</div></div>`,'Fine Records')}
function fineDetail(){const c=cases.find(x=>x.id===state.caseId)||cases[0];return shell(`<button class="crumb-back" onclick="nav('fines')">← Back to Fine Records</button><div class="page-head"><div><div class="eyebrow">Fine Record</div><h1 class="page-title">${c.fine}</h1><p class="subtitle">Purchase order ${c.po} · ${c.supplier}</p></div><button class="btn primary" onclick="viewCase('${c.id}')">Open Investigation Case →</button></div><div class="cols"><div class="card"><div class="cardhead"><div class="cardtitle">Fine details</div></div><div class="inner"><div class="kvgrid">${[['Fine ID',c.fine],['Metric',c.metric],['Supplier',c.supplier],['PO',c.po],['Original fine amount',money(c.amount)],['Related Case',c.id]].map(a=>`<div class="kv"><div class="label">${a[0]}</div><div class="value">${a[1]}</div></div>`).join('')}</div><hr class="divider"><div class="section-label">Linked investigation</div><div class="tinyrow">${badge(c.status)} <button class="btn small" onclick="viewCase('${c.id}')">View investigation →</button></div></div></div><div><div class="card sidecard"><div class="section-label">Context</div><p class="paragraph">In the real application, this view would show the Fine Record, its disputes and linked investigation context from Domain APIs.</p><div class="note">Mock data: fine amounts, suppliers, and purchase orders here are illustrative only.</div></div></div></div>`,'Fine Records / Detail')}
function casePage(){const c=cases.find(x=>x.id===state.caseId)||cases[0];let eligible=['pending','investigating','revision_required','handed_off'].includes(c.status);let tabs=[['overview','Overview'],['finding','Agent Finding'],['evidence','Evidence'],['outcome','Outcome & Approval'],['history','History']];return shell(`<button class="crumb-back" onclick="nav('cases')">← Back to Investigations</button><div class="page-head"><div><div class="eyebrow">Investigation Workspace</div><h1 class="page-title">${c.id}</h1><div class="tinyrow">${badge(c.status)} <span class="id-chip">${c.fine}</span><span class="id-chip">${c.po}</span></div></div><div class="action-row">${eligible?`<button class="btn primary" onclick="demoStart('${c.id}')">▶ ${c.status==='revision_required'?'Reinvestigate':'Start Investigation'}</button>`:''}<button class="btn" onclick="toast('Case refresh simulated in this prototype')">↻ Refresh</button></div></div><div class="case-layout"><div class="card"><div class="tabs">${tabs.map(([k,v])=>`<button class="tab ${state.tab===k?'selected':''}" onclick="state.tab='${k}';render()">${v}</button>`).join('')}</div><div class="inner">${tabContent(c)}</div></div><aside><div class="card sidecard"><div class="section-label">Case summary</div><div class="kvgrid">${[['Fine Record',c.fine],['Fine Metric',c.metric],['Supplier',c.supplier],['Origin',pretty(c.origin)],['Created',c.created],['Fine Amount',money(c.amount)]].map(a=>`<div class="kv"><div class="label">${a[0]}</div><div class="value">${a[1]}</div></div>`).join('')}</div><hr class="divider"><button class="btn" style="width:100%" onclick="state.caseId='${c.id}';nav('fine')">View Fine Record →</button></div><div class="card sidecard"><div class="section-label">Workflow stage</div>${['pending','investigating','findings_submitted','awaiting_approval','closed'].map((s,i)=>`<div class="step"><div class="stepicon">${i+1}</div><div><div class="steptitle">${pretty(s)}</div><div class="stepdesc">${c.status===s?'Current stage':s==='closed'&&c.status==='closed'?'Complete':'Workflow milestone'}</div></div></div>`).join('')}<p class="annotation">Simplified display: actual Case lifecycle also includes handoff and revision paths.</p></div></aside></div>`,'Investigations / Case')}
function tabContent(c){if(state.tab==='overview')return `<div class="section-label">Operational summary</div><h2 class="heading">Fine investigation at a glance</h2><p class="paragraph">The Case workspace brings the operational context, Agent analysis, computed outcome, and human decision into one place. All facts shown here are synthetic presentation records.</p><div class="infobox"><div class="cap">Current status</div><div class="tinyrow">${badge(c.status)} <span style="font-size:12px;color:#566780">${c.status==='awaiting_approval'?'Agent assessment is ready for human review.':c.status==='handed_off'?'Additional human investigation is required.':c.status==='pending'?'Agent investigation has not started yet.':c.status==='closed'?'The reviewed result is closed.':'Check the latest investigation and workflow results.'}</span></div></div><div class="section-label">Latest Agent assessment</div><h3 class="heading">${esc(c.cause)}</h3><p class="paragraph">${esc(c.finding)}</p><div class="action-row" style="margin-top:20px"><button class="btn" onclick="state.tab='finding';render()">View Finding →</button><button class="btn" onclick="state.tab='outcome';render()">Outcome & Approval →</button></div>`;
if(state.tab==='finding')return `<div class="section-label">Agent assessment · ${c.findingId||'No Finding'}</div><h2 class="heading">${esc(c.cause)}</h2><div class="tinyrow"><span class="badge ${c.confidence==='High'?'green':c.confidence==='Low'?'amber':'gray'}">Confidence: ${esc(c.confidence)}</span><span class="badge gray">Stored Finding ${c.findingId?'v3':'—'}</span></div><hr class="divider"><div class="section-label">Investigation summary</div><p class="paragraph">${esc(c.finding)}</p><div class="infobox"><div class="cap">Interpretation</div><p class="paragraph">An Agent Finding is a proposed assessment, not a human approval. Confirm the evidence and calculated outcome before making a decision.</p></div><div class="section-label">Supporting records</div>${c.evidence.length?c.evidence.map((e,i)=>`<div class="step"><div class="stepicon">▤</div><div><div class="steptitle">${esc(e)}</div><div class="stepdesc">Synthetic evidence reference #${i+1}</div></div></div>`).join(''):`<p class="paragraph">No Finding evidence has been submitted for this sample case.</p>`}`;
if(state.tab==='evidence')return `<div class="section-label">Evidence review</div><h2 class="heading">Sources linked to the Finding</h2><p class="paragraph" style="margin-bottom:14px">Example evidence references. In implementation, selecting a reference should reveal the stored Domain context snapshot and source metadata.</p>${c.evidence.length?c.evidence.map((e,i)=>`<div class="step"><div class="stepicon">▤</div><div style="flex:1"><div class="steptitle">${esc(e)}</div><div class="stepdesc">Evidence ref: MOCK-EVD-00${i+1}</div></div><button class="btn small" onclick="toast('Demo evidence: ${esc(e)} — synthetic source, no actual record loaded')">Inspect →</button></div>`).join(''):`<div class="empty"><strong>No evidence references yet</strong>The Agent or reviewer may need further investigation.</div>`}<div class="note">Supplier assertions and model-generated conclusions must be visually distinguished from authoritative operational records.</div>`;
if(state.tab==='outcome')return `<div class="section-label">Deterministic evaluation</div><h2 class="heading">Calculated Outcome</h2>${c.reversal===null?`<div class="empty"><strong>No Outcome available</strong>This Case has not reached a completed evaluation.</div>`:`<div class="moneyrow"><span>Original OTIF fine</span><strong>${money(c.amount)}</strong></div><div class="moneyrow"><span>Proposed reversal</span><strong>${money(c.reversal)}</strong></div><div class="moneyrow"><span>Remaining corrected fine (illustrative)</span><strong>${money(c.amount-c.reversal)}</strong></div><div class="moneyrow highlight"><span>Proposed reversal</span><strong>${money(c.reversal)}</strong></div><p class="annotation">Mock amounts are illustrative, not a live policy calculation. Actual approval stages depend on the stored Outcome and policy configuration.</p><hr class="divider"><div class="section-label">Human decision</div><h3 class="heading">${c.status==='awaiting_approval'?'Associate review required':c.status==='closed'?'Completed review':'No pending decision'}</h3>${c.status==='awaiting_approval'?`${state.role==='admin'?'<div class="note">Admin role cannot approve lines under the current backend role rules.</div>':`<div class="formline"><label>Decision comment</label><textarea id="decision-comment" placeholder="Reason for approval or rejection…">${esc(state.decisionComment)}</textarea></div><div class="action-row"><button class="btn outlinegreen" onclick="decide('approved')">✓ Approve line</button><button class="btn outlinered" onclick="decide('rejected')">✕ Reject line</button></div><p class="annotation">Demo click only. A real decision writes to Domain, then the Agent needs a separate Resume call.</p>`}`:`<span class="badge ${c.status==='closed'?'green':'gray'}">${c.status==='closed'?'Approved / closed':'No action available in this stage'}</span>`}`}`;
if(state.tab==='history')return `<div class="section-label">Available record history</div><h2 class="heading">Investigation versions & decisions</h2><div class="timeline"><div class="event"><h4>Case created</h4><p>${c.created} · ${pretty(c.origin)}</p></div>${c.run?`<div class="event"><h4>Agent run ${c.run}</h4><p>Example checkpointed investigation</p></div>`:''}${c.findingId?`<div class="event"><h4>Finding ${c.findingId}</h4><p>Versioned assessment stored by Domain</p></div>`:''}${c.eval?`<div class="event"><h4>Evaluation ${c.eval}</h4><p>Deterministic calculation associated with Finding</p></div>`:''}${c.status==='closed'?`<div class="event"><h4>Decision recorded</h4><p>Human approval workflow completed</p></div>`:''}</div><div class="note">This is not a complete audit timeline. The backend does not expose a general Case status-event listing endpoint.</div>`;
return ''}
function decide(decision){let c=cases.find(x=>x.id===state.caseId);if(!c||c.status!=='awaiting_approval')return; if(state.role==='admin'){toast('This role cannot approve under the current backend rules.');return}let text=$('#decision-comment')?.value||'';if(!text.trim()){toast('Add a short decision comment for this demo.');return}c.status=decision==='approved'?'closed':'revision_required';state.decisionComment='';render();toast(`Mock ${decision} decision shown. No real API request was made.`)}
function demoStart(id){let c=cases.find(x=>x.id===id);if(!c)return;c.status='investigating';if(!c.run)c.run='RUN-DEMO-001';render();toast('Mock investigation started. No LangGraph execution or API call occurred.')}function logout(){state.page='cases';render();window.scrollTo(0,0)}function render(){let html=state.page==='login'?login():state.page==='cases'?casesPage():state.page==='fines'?finePage():state.page==='fine'?fineDetail():casePage();$('#root').innerHTML=html}function renderKeepFocus(){let el=document.activeElement,pos=el.selectionStart,name=el.getAttribute('placeholder');render();let next=[...document.querySelectorAll('input')].find(x=>x.getAttribute('placeholder')===name);if(next){next.focus();try{next.setSelectionRange(pos,pos)}catch(e){}}}render();
</script></body></html>
