server {
    listen 80;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    location /api/auth/ {
        proxy_pass http://auth-service:8000/;
    }

    # Service-to-service routes are not reachable from outside.
    location ~ ^/api/domain/(api/)?v1/internal(/|$) {
        return 404;
    }

    location /api/domain/v1/ {
        proxy_pass http://domain-service:8000/api/v1/;
    }

    location /api/domain/ {
        proxy_pass http://domain-service:8000/;
    }

    location /api/agent/ {
        proxy_pass http://agent-service:8000/;
        proxy_read_timeout 300s;
    }

    location = /health {
        default_type text/plain;
        return 200 'gateway ok';
    }
}
