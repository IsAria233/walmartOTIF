[project]
name = "walmart-otif-domain-service"
version = "0.1.0"
description = "Domain Service for Walmart OTIF investigations"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "psycopg2-binary>=2.9.9,<3",
    "pydantic>=2.8,<3",
    "pyjwt>=2.10,<3",
    "sqlalchemy>=2.0.30,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
