services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  auth-service:
    build: ./auth-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on: [db]

  domain-service:
    build: ./domain-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # domain-service runs migrations on start, so the database must be accepting connections first.
    depends_on:
      db:
        condition: service_healthy

  agent-service:
    build: ./agent-service
    env_file: .env
    environment:
      DOMAIN_SERVICE_URL: http://domain-service:8000
      # Investigation runs are checkpointed here, so they survive a restart and can resume after approval.
      AGENT_CHECKPOINT_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      domain-service:
        condition: service_started

  gateway:
    build: ./gateway
    ports:
      - "8080:80"
    depends_on: [auth-service, domain-service, agent-service]

  frontend:
    build: ./frontend
    profiles: ["frontend"]   # enable after the React app is scaffolded
    ports:
      - "3000:80"
    depends_on: [gateway]

volumes:
  pgdata:
