services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on: [db]

  domain-service:
    build: ./domain-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on: [db]

  agent-service:
    build: ./agent-service
    env_file: .env
    environment:
      DOMAIN_SERVICE_URL: http://domain-service:8000
    depends_on: [domain-service]

  gateway:
    build: ./gateway
    ports:
      - "8080:80"
    depends_on: [auth-service, domain-service, agent-service]

  frontend:
    build: ./frontend
    profiles: ["frontend"]   # enable after the React app is scaffolded
    ports:
      - "3000:80"
    depends_on: [gateway]

volumes:
  pgdata:
